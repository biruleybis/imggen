<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImgGen — Painel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f11;
    --surface: #18181c;
    --surface2: #222228;
    --border: #2e2e38;
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --green: #22c55e;
    --red: #ef4444;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
  }

  header .logo {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 500;
    color: var(--accent2);
    letter-spacing: -0.5px;
  }

  header .logo span { color: var(--muted); }

  header .badge {
    background: var(--accent);
    color: white;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .layout {
    display: flex;
    flex: 1;
    height: calc(100vh - 57px);
    overflow: hidden;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 16px 18px 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .btn-new {
    background: var(--accent);
    color: white;
    border: none;
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn-new:hover { opacity: .85; }

  .template-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .template-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s;
    border: 1px solid transparent;
  }
  .template-item:hover { background: var(--surface2); }
  .template-item.active { background: var(--surface2); border-color: var(--accent); }

  .template-thumb {
    width: 42px;
    height: 42px;
    border-radius: 6px;
    object-fit: cover;
    background: var(--surface2);
    flex-shrink: 0;
  }

  .template-info { flex: 1; min-width: 0; }
  .template-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .template-slug { font-family: var(--mono); font-size: 10px; color: var(--muted); }

  .template-del {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 4px;
    border-radius: 4px;
    transition: color .15s;
  }
  .template-del:hover { color: var(--red); }

  /* ── Main ── */
  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ── Canvas area ── */
  .canvas-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    padding: 24px;
  }

  .canvas-wrap {
    position: relative;
    display: inline-block;
    cursor: default;
    box-shadow: 0 0 0 1px var(--border), 0 20px 60px rgba(0,0,0,.5);
    border-radius: 4px;
    overflow: hidden;
    max-width: 100%;
    max-height: calc(100vh - 150px);
  }

  #preview-img {
    display: block;
    max-width: 100%;
    max-height: calc(100vh - 150px);
    user-select: none;
  }

  #box-overlay {
    position: absolute;
    border: 2px solid var(--accent);
    background: rgba(108,99,255,0.15);
    cursor: move;
    user-select: none;
    box-shadow: 0 0 0 1px rgba(108,99,255,0.4);
  }

  #box-overlay::after {
    content: '⠿';
    position: absolute;
    bottom: 2px;
    right: 4px;
    font-size: 12px;
    color: var(--accent2);
    opacity: .7;
    cursor: se-resize;
  }

  .resize-handle {
    position: absolute;
    width: 10px;
    height: 10px;
    background: var(--accent);
    border-radius: 2px;
    cursor: se-resize;
    bottom: -5px;
    right: -5px;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
  }
  .empty-state h2 { font-size: 20px; font-weight: 400; margin-bottom: 8px; }
  .empty-state p { font-size: 13px; }

  .canvas-hint {
    margin-top: 12px;
    font-size: 11px;
    color: var(--muted);
    font-family: var(--mono);
  }

  /* ── Props panel ── */
  .props {
    width: 300px;
    min-width: 300px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .props-header {
    padding: 16px 18px 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }

  .props-section {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }

  .props-section h3 {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .field { margin-bottom: 10px; }
  .field label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; }

  .field input[type=text],
  .field input[type=number],
  .field select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 12px;
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }

  .field-row { display: flex; gap: 8px; }
  .field-row .field { flex: 1; }

  .field input[type=color] {
    width: 100%;
    height: 34px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    cursor: pointer;
    padding: 2px;
  }

  .field input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }

  .field-check {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .field-check label { font-size: 12px; color: var(--text); cursor: pointer; }

  /* URL box */
  .url-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent2);
    word-break: break-all;
    cursor: pointer;
    transition: border-color .15s;
    position: relative;
  }
  .url-box:hover { border-color: var(--accent); }
  .url-box .copy-hint { font-size: 10px; color: var(--muted); margin-top: 4px; }

  .btn-save {
    display: block;
    width: calc(100% - 36px);
    margin: 16px 18px;
    background: var(--accent);
    color: white;
    border: none;
    padding: 11px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
    font-family: var(--sans);
  }
  .btn-save:hover { opacity: .85; }

  .btn-preview {
    display: block;
    width: calc(100% - 36px);
    margin: 0 18px 16px;
    background: transparent;
    color: var(--accent2);
    border: 1px solid var(--border);
    padding: 9px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: border-color .15s;
    font-family: var(--sans);
  }
  .btn-preview:hover { border-color: var(--accent2); }

  /* Modal */
  .modal-bg {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-bg.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    width: 420px;
    max-width: 95vw;
  }

  .modal h2 { font-size: 18px; margin-bottom: 20px; }

  .modal .field { margin-bottom: 14px; }
  .modal .field label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 5px; }
  .modal .field input[type=text],
  .modal .field input[type=file] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
    font-family: var(--sans);
    transition: border-color .15s;
  }
  .modal .field input:focus { border-color: var(--accent); }

  .modal-btns { display: flex; gap: 10px; margin-top: 20px; }

  .btn-cancel {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }

  .btn-confirm {
    flex: 2;
    background: var(--accent);
    border: none;
    color: white;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--green);
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transform: translateY(8px);
    transition: all .25s;
    z-index: 200;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.err { background: var(--red); }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="logo">img<span>/</span>gen</div>
  <div class="badge">painel</div>
</header>

<div class="layout">

  <!-- Sidebar: template list -->
  <div class="sidebar">
    <div class="sidebar-header">
      Templates
      <button class="btn-new" onclick="openNewModal()">+ Novo</button>
    </div>
    <div class="template-list" id="template-list">
      <!-- populated by JS -->
    </div>
  </div>

  <!-- Main canvas -->
  <div class="main">
    <div class="canvas-area" id="canvas-area">
      <div class="empty-state" id="empty-state">
        <h2>Nenhum template selecionado</h2>
        <p>Crie um novo template ou selecione um na lista.</p>
      </div>
      <div class="canvas-wrap" id="canvas-wrap" style="display:none">
        <img id="preview-img" src="" alt="template preview" draggable="false">
        <div id="box-overlay">
          <div class="resize-handle" id="resize-handle"></div>
        </div>
      </div>
      <div class="canvas-hint" id="canvas-hint" style="display:none">
        Arraste a caixa para reposicionar · Arraste o canto para redimensionar
      </div>
    </div>

    <!-- Props panel -->
    <div class="props" id="props-panel" style="display:none">
      <div class="props-header">Configurações</div>

      <div class="props-section">
        <h3>Posição da caixa</h3>
        <div class="field-row">
          <div class="field"><label>X</label><input type="number" id="p-bx" onchange="applyProps()"></div>
          <div class="field"><label>Y</label><input type="number" id="p-by" onchange="applyProps()"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Largura</label><input type="number" id="p-bw" onchange="applyProps()"></div>
          <div class="field"><label>Altura</label><input type="number" id="p-bh" onchange="applyProps()"></div>
        </div>
      </div>

      <div class="props-section">
        <h3>Texto</h3>
        <div class="field-row">
          <div class="field"><label>Tamanho fonte</label><input type="number" id="p-fs" onchange="applyProps()"></div>
          <div class="field"><label>Alinhamento</label>
            <select id="p-align" onchange="applyProps()">
              <option value="center">Centro</option>
              <option value="left">Esquerda</option>
              <option value="right">Direita</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Cor do texto</label><input type="color" id="p-fc" onchange="applyProps()"></div>
          <div class="field"><label>Cor do fundo</label><input type="color" id="p-bc" onchange="applyProps()"></div>
        </div>
        <div class="field-check">
          <input type="checkbox" id="p-bold" onchange="applyProps()">
          <label for="p-bold">Negrito</label>
        </div>
      </div>

      <div class="props-section">
        <h3>Prévia com nome</h3>
        <div class="field">
          <label>Nome de teste</label>
          <input type="text" id="p-testname" value="Bruno" oninput="updateRenderPreview()">
        </div>
        <button class="btn-preview" onclick="openRenderPreview()">Ver resultado renderizado</button>
      </div>

      <div class="props-section">
        <h3>URL de uso (GHL / Worker)</h3>
        <div class="url-box" id="url-box" onclick="copyUrl()">
          <div id="url-text">—</div>
          <div class="copy-hint">Clique para copiar</div>
        </div>
      </div>

      <button class="btn-save" onclick="saveTemplate()">💾 Salvar configuração</button>
    </div>
  </div>
</div>

<!-- New template modal -->
<div class="modal-bg" id="modal-new">
  <div class="modal">
    <h2>Novo template</h2>
    <div class="field">
      <label>Nome do cliente / identificador</label>
      <input type="text" id="m-label" placeholder="Ex: Ivens Fisioterapia">
    </div>
    <div class="field">
      <label>Slug (usado na URL)</label>
      <input type="text" id="m-slug" placeholder="Ex: ivens">
    </div>
    <div class="field">
      <label>Foto do cliente</label>
      <input type="file" id="m-file" accept="image/*">
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-confirm" onclick="createTemplate()">Criar template</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const BASE = window.location.origin;
let templates = [];
let activeSlug = null;
let imgNaturalW = 1, imgNaturalH = 1;
let displayW = 1, displayH = 1;

// Box drag state
let dragging = false, resizing = false;
let dragStartX, dragStartY, boxStartX, boxStartY, boxStartW, boxStartH;

// ── Init ────────────────────────────────────────────────────────────────────
async function loadTemplates() {
  const r = await fetch('/api/templates');
  templates = await r.json();
  renderSidebar();
}

function renderSidebar() {
  const list = document.getElementById('template-list');
  if (templates.length === 0) {
    list.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted);font-size:12px">Nenhum template ainda</div>`;
    return;
  }
  list.innerHTML = templates.map(t => `
    <div class="template-item ${t.slug === activeSlug ? 'active' : ''}" onclick="selectTemplate('${t.slug}')">
      <img class="template-thumb" src="/template-image/${t.slug}?t=${Date.now()}" onerror="this.style.background='var(--surface2)'">
      <div class="template-info">
        <div class="template-name">${t.label || t.slug}</div>
        <div class="template-slug">${t.slug}</div>
      </div>
      <button class="template-del" onclick="event.stopPropagation();deleteTemplate('${t.slug}')" title="Excluir">×</button>
    </div>
  `).join('');
}

// ── Select template ──────────────────────────────────────────────────────────
async function selectTemplate(slug) {
  activeSlug = slug;
  renderSidebar();

  const r = await fetch(`/api/templates/${slug}`);
  const config = await r.json();

  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('canvas-wrap').style.display = 'inline-block';
  document.getElementById('canvas-hint').style.display = 'block';
  document.getElementById('props-panel').style.display = 'flex';
  document.getElementById('props-panel').style.flexDirection = 'column';

  const img = document.getElementById('preview-img');
  img.onload = () => {
    imgNaturalW = img.naturalWidth;
    imgNaturalH = img.naturalHeight;
    displayW = img.offsetWidth;
    displayH = img.offsetHeight;
    updateBoxOverlay(config.box);
    updateUrl();
  };
  img.src = `/template-image/${slug}?t=${Date.now()}`;

  fillProps(config);
  updateUrl();
}

function fillProps(config) {
  document.getElementById('p-bx').value = config.box.x;
  document.getElementById('p-by').value = config.box.y;
  document.getElementById('p-bw').value = config.box.width;
  document.getElementById('p-bh').value = config.box.height;
  document.getElementById('p-fs').value = config.text.font_size;
  document.getElementById('p-fc').value = config.text.font_color;
  document.getElementById('p-bc').value = config.text.bg_color;
  document.getElementById('p-bold').checked = config.text.bold;
  document.getElementById('p-align').value = config.text.align || 'center';
}

function getProps() {
  return {
    box_x: parseInt(document.getElementById('p-bx').value),
    box_y: parseInt(document.getElementById('p-by').value),
    box_width: parseInt(document.getElementById('p-bw').value),
    box_height: parseInt(document.getElementById('p-bh').value),
    font_size: parseInt(document.getElementById('p-fs').value),
    font_color: document.getElementById('p-fc').value,
    bg_color: document.getElementById('p-bc').value,
    bold: document.getElementById('p-bold').checked,
    align: document.getElementById('p-align').value,
  };
}

// ── Box overlay (drag & resize) ──────────────────────────────────────────────
function updateBoxOverlay(box) {
  const img = document.getElementById('preview-img');
  displayW = img.offsetWidth;
  displayH = img.offsetHeight;
  const scaleX = displayW / imgNaturalW;
  const scaleY = displayH / imgNaturalH;

  const el = document.getElementById('box-overlay');
  el.style.left = (box.x * scaleX) + 'px';
  el.style.top = (box.y * scaleY) + 'px';
  el.style.width = (box.width * scaleX) + 'px';
  el.style.height = (box.height * scaleY) + 'px';
}

function applyProps() {
  if (!activeSlug) return;
  const p = getProps();
  updateBoxOverlay({ x: p.box_x, y: p.box_y, width: p.box_width, height: p.box_height });
  updateUrl();
}

// Drag box
const box = document.getElementById('box-overlay');
const resizeHandle = document.getElementById('resize-handle');

box.addEventListener('mousedown', (e) => {
  if (e.target === resizeHandle) return;
  dragging = true;
  dragStartX = e.clientX; dragStartY = e.clientY;
  boxStartX = parseInt(document.getElementById('p-bx').value);
  boxStartY = parseInt(document.getElementById('p-by').value);
  e.preventDefault();
});

resizeHandle.addEventListener('mousedown', (e) => {
  resizing = true;
  dragStartX = e.clientX; dragStartY = e.clientY;
  boxStartW = parseInt(document.getElementById('p-bw').value);
  boxStartH = parseInt(document.getElementById('p-bh').value);
  e.preventDefault();
  e.stopPropagation();
});

document.addEventListener('mousemove', (e) => {
  if (!dragging && !resizing) return;
  const img = document.getElementById('preview-img');
  displayW = img.offsetWidth; displayH = img.offsetHeight;
  const scaleX = imgNaturalW / displayW;
  const scaleY = imgNaturalH / displayH;
  const dx = (e.clientX - dragStartX) * scaleX;
  const dy = (e.clientY - dragStartY) * scaleY;

  if (dragging) {
    document.getElementById('p-bx').value = Math.round(boxStartX + dx);
    document.getElementById('p-by').value = Math.round(boxStartY + dy);
  } else {
    document.getElementById('p-bw').value = Math.max(60, Math.round(boxStartW + dx));
    document.getElementById('p-bh').value = Math.max(30, Math.round(boxStartH + dy));
  }
  applyProps();
});

document.addEventListener('mouseup', () => { dragging = false; resizing = false; });

// Recalc overlay on window resize
window.addEventListener('resize', () => {
  if (!activeSlug) return;
  const p = getProps();
  updateBoxOverlay({ x: p.box_x, y: p.box_y, width: p.box_width, height: p.box_height });
});

// ── URL ──────────────────────────────────────────────────────────────────────
function updateUrl() {
  if (!activeSlug) return;
  const url = `${BASE}/render?template=${activeSlug}&name={{contact.first_name}}`;
  document.getElementById('url-text').textContent = url;
}

function updateRenderPreview() { /* live render on open */ }

function openRenderPreview() {
  if (!activeSlug) return;
  const name = document.getElementById('p-testname').value || 'Bruno';
  window.open(`${BASE}/render?template=${activeSlug}&name=${encodeURIComponent(name)}`, '_blank');
}

function copyUrl() {
  if (!activeSlug) return;
  const url = `${BASE}/render?template=${activeSlug}&name={{contact.first_name}}`;
  navigator.clipboard.writeText(url);
  showToast('URL copiada!');
}

// ── Save ─────────────────────────────────────────────────────────────────────
async function saveTemplate() {
  if (!activeSlug) return;
  const p = getProps();
  const r = await fetch(`/api/templates/${activeSlug}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(p),
  });
  if (r.ok) showToast('Salvo com sucesso!');
  else showToast('Erro ao salvar', true);
}

// ── New template modal ────────────────────────────────────────────────────────
function openNewModal() {
  document.getElementById('modal-new').classList.add('open');
  document.getElementById('m-label').value = '';
  document.getElementById('m-slug').value = '';
  document.getElementById('m-file').value = '';
}

function closeModal() {
  document.getElementById('modal-new').classList.remove('open');
}

document.getElementById('m-label').addEventListener('input', (e) => {
  const slug = e.target.value.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
  document.getElementById('m-slug').value = slug;
});

async function createTemplate() {
  const label = document.getElementById('m-label').value.trim();
  const slug = document.getElementById('m-slug').value.trim();
  const file = document.getElementById('m-file').files[0];
  if (!label || !slug || !file) { showToast('Preencha todos os campos', true); return; }

  const fd = new FormData();
  fd.append('label', label);
  fd.append('slug', slug);
  fd.append('image', file);
  fd.append('box_x', '80');
  fd.append('box_y', '400');
  fd.append('box_width', '320');
  fd.append('box_height', '70');
  fd.append('font_size', '42');
  fd.append('font_color', '#2b2bbf');
  fd.append('bg_color', '#ffffff');
  fd.append('bold', 'true');
  fd.append('align', 'center');

  const r = await fetch('/api/templates', { method: 'POST', body: fd });
  if (r.ok) {
    closeModal();
    await loadTemplates();
    selectTemplate(slug);
    showToast('Template criado!');
  } else {
    const err = await r.json();
    showToast(err.error || 'Erro ao criar', true);
  }
}

// ── Delete ────────────────────────────────────────────────────────────────────
async function deleteTemplate(slug) {
  if (!confirm(`Excluir template "${slug}"?`)) return;
  await fetch(`/api/templates/${slug}`, { method: 'DELETE' });
  if (activeSlug === slug) {
    activeSlug = null;
    document.getElementById('empty-state').style.display = 'block';
    document.getElementById('canvas-wrap').style.display = 'none';
    document.getElementById('canvas-hint').style.display = 'none';
    document.getElementById('props-panel').style.display = 'none';
  }
  await loadTemplates();
  showToast('Template excluído');
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg, err = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (err ? ' err' : '') + ' show';
  setTimeout(() => t.classList.remove('show'), 2500);
}

loadTemplates();
</script>
</body>
